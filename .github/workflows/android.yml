name: Android build

on:
  push:
    branches: [develop, release, "feature/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Optional: with this secret set, the built app has purchases switched on.
      - name: RevenueCat key
        run: echo "REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: like-home-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Family functions tests
        run: npm test
      - name: Functions load
        run: node -e "require('./index.js')"
