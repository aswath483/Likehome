name: Deploy family backend

# Run by hand from the Actions tab once the Firebase project exists. Needs two repository
# secrets (Settings › Secrets and variables › Actions):
#   FIREBASE_PROJECT_ID       the project id, e.g. like-home-12345
#   FIREBASE_SERVICE_ACCOUNT  a service account key (JSON) with Firebase Admin rights
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - name: Deploy rules and functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes,functions --project "$PROJECT" --non-interactive --force
